[include fluidd.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_1690FF08610039AF39E9F45BC12000F5-if00

[virtual_sdcard]
path: /home/tim/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 2000
max_z_velocity: 5
max_z_accel: 100

#####################################################################
# X/Y Stepper Settings (CoreXY)
#####################################################################

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -1
position_min: -1
position_max: 120
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -9
position_min: -9
position_max: 120
homing_speed: 30
homing_retract_dist: 0

#####################################################################
# Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: ^P1.25  # Optischer Z-MIN Sensor
position_endstop: 0
position_max: 120
homing_speed: 8
second_homing_speed: 2
homing_retract_dist: 2

#####################################################################
# Extruder
#####################################################################
[thermistor my_NTC3950]
temperature1: 25
resistance1: 100000
temperature2: 150
resistance2: 1791
temperature3: 250
resistance3: 283

[extruder]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 16
#rotation_distance: 7.4  # Angepasst basierend auf deinen 431 steps/mm
rotation_distance: 7.78
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: P0.24
#control: pid
#pid_Kp: 34.46
#pid_Ki: 5.39
#pid_Kd: 55.10
min_temp: 5
max_temp: 280
max_extrude_only_distance: 200
pressure_advance: 0.025  # Viel niedriger für Direct Drive
pressure_advance_smooth_time: 0.020  # Auch niedriger

#####################################################################
# Heated Bed
#####################################################################

[heater_bed]
heater_pin: P2.5
sensor_type: Generic 3950
sensor_pin: P0.23
#control: pid
#pid_Kp: 36.67
#pid_Ki: 7.23
#pid_Kd: 124.06
min_temp: 5
max_temp: 130

#####################################################################
# Fan Control
#####################################################################

[fan]
pin: P2.3

[heater_fan hotend_fan]
pin: P2.4
heater: extruder
heater_temp: 50.0

[controller_fan my_controller_fan]
pin: P2.0
stepper: stepper_x,stepper_y,stepper_z,extruder
fan_speed: 0.6

########################################
# TMC2209 configuration
########################################

# For TMC2209 UART
#   1) Remove all of the jumpers below the stepper drivers
#   2) Place jumpers on the red pin headers labeled XUART (XUART, YUART etc.)

[tmc2209 stepper_x]
uart_pin: P1.17
run_current: 0.800
hold_current: .25
diag_pin: ^P1.29
driver_SGTHRS: 70
#stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: P1.15
run_current: 0.800
hold_current: .25
diag_pin: ^P1.27
driver_SGTHRS: 70
#stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: P1.10
run_current: 0.650
hold_current: .25
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: P1.8
run_current: 0.500
stealthchop_threshold: 999999

